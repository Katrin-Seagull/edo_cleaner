[package]
name = "edo_cleaner"
version = "1.0.0"
edition = "2021"
authors = ["Antonova Ekaterina"]

[dependencies]
eframe = "0.27"
rusqlite = { version = "0.31", features = ["bundled"] }
winreg = "0.52"
walkdir = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true